<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f5ef">
	<title>Sign in</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1d2d2c;
			--muted: #687976;
			--line: #d7e1de;
			--paper: #eef5f2;
			--white: #fff;
			--green: #176b68;
			--green-dark: #104c4b;
			--lime: #ffbd8a;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 20px;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(circle at 14% 15%, rgb(23 107 104 / 12%), transparent 28%), radial-gradient(circle at 88% 80%, rgb(255 189 138 / 18%), transparent 30%), radial-gradient(#d1ded9 0.7px, transparent 0.7px);
			background-size: auto, auto, 18px 18px;
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
		}

		.page {
			width: min(100%, 980px);
			min-height: 610px;
			display: grid;
			grid-template-columns: 1fr 1fr;
			overflow: hidden;
			background: var(--white);
			border: 1px solid #e6e9e2;
			box-shadow: 0 24px 70px rgb(32 39 33 / 10%);
			animation: appear 500ms ease-out both;
		}

		.welcome {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 610px;
			padding: 38px;
			overflow: hidden;
			color: #f8f8ef;
			background-color: #155b5b;
			background-image: radial-gradient(rgb(255 255 255 / 8%) 0.7px, transparent 0.7px), linear-gradient(145deg, #123d49 0%, #176b68 58%, #56a292 100%);
			background-size: 16px 16px, auto;
		}

		.welcome::before,
		.welcome::after {
			position: absolute;
			content: "";
			border: 1px solid rgb(255 255 255 / 17%);
			border-radius: 50%;
			pointer-events: none;
		}

		.welcome::before {
			width: 390px;
			height: 390px;
			right: -170px;
			bottom: 70px;
		}

		.welcome::after {
			width: 290px;
			height: 290px;
			right: -120px;
			bottom: 120px;
		}

		.welcome-copy {
			position: relative;
			z-index: 1;
			width: min(100%, 390px);
		}

		.welcome-copy h1 {
			margin: 0;
			color: #fffaf5;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(48px, 5vw, 64px);
			font-weight: 400;
			line-height: 1;
			letter-spacing: 0;
		}

		.welcome-product {
			margin: 12px 0 0;
			color: #ffe0c3;
			font-size: 21px;
			font-weight: 700;
			line-height: 1.3;
		}

		.welcome-rule {
			width: 54px;
			height: 3px;
			margin-top: 24px;
			background: var(--lime);
		}

		.welcome-description {
			max-width: 300px;
			margin: 18px 0 0;
			color: rgb(248 248 239 / 76%);
			font-size: 14px;
			line-height: 1.7;
		}

		.form-panel {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 52px clamp(28px, 6vw, 68px);
		}

		.form-content { width: 100%; max-width: 350px; }

		.form-content h2 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 34px;
			font-weight: 400;
			letter-spacing: 0;
		}

		.intro {
			margin: 10px 0 32px;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.6;
		}

		.field { margin-bottom: 20px; }

		label {
			display: block;
			margin-bottom: 8px;
			font-size: 12px;
			font-weight: 700;
		}

		input {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			color: var(--ink);
			background: #fff;
			border: 1px solid var(--line);
			border-radius: 3px;
			font: inherit;
			font-size: 14px;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		input::placeholder { color: #a0a69e; }

		input:focus-visible {
			outline: none;
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgb(39 93 67 / 12%);
		}

		.password-wrap { position: relative; }

		.password-wrap input { padding-right: 62px; }

		.reveal {
			position: absolute;
			top: 50%;
			right: 12px;
			padding: 6px 2px;
			transform: translateY(-50%);
			color: var(--muted);
			background: transparent;
			border: 0;
			cursor: pointer;
			font: inherit;
			font-size: 11px;
			font-weight: 700;
		}

		.submit-button {
			width: 100%;
			min-height: 49px;
			margin-top: 5px;
			color: #fff;
			background: var(--green);
			border: 0;
			border-radius: 3px;
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			font-weight: 700;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		.submit-button:hover { background: var(--green-dark); }
		.submit-button:active { transform: translateY(1px); }

		.form-message {
			min-height: 18px;
			margin: 12px 0 0;
			color: var(--green-dark);
			font-size: 12px;
			line-height: 1.5;
		}

		.connection-status {
			margin: -18px 0 20px;
			color: var(--muted);
			font-size: 12px;
			line-height: 1.5;
		}

		[hidden] { display: none !important; }

		@keyframes appear {
			from { opacity: 0; transform: translateY(9px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 700px) {
			body { padding: 0; background-size: 14px 14px; }
			.page {
				width: 100%;
				min-height: 100vh;
				grid-template-columns: 1fr;
				border: 0;
			}
			.welcome {
				min-height: 205px;
				padding: 24px;
			}
			.welcome-copy { width: 100%; }
			.welcome-copy h1 { font-size: 43px; }
			.welcome-product { font-size: 18px; }
			.welcome-rule { margin-top: 14px; }
			.welcome-description { display: none; }
			.form-panel { align-items: flex-start; padding: 40px 24px 52px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				scroll-behavior: auto !important;
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: 0.01ms !important;
			}
		}
	</style>
</head>
<body>
	<main class="page">
		<section class="welcome" aria-label="Welcome">
			<div class="welcome-copy">
				<h1>Websankul</h1>
				<p class="welcome-product">Studio Booking App</p>
				<div class="welcome-rule" aria-hidden="true"></div>
				<p class="welcome-description">A calmer way to plan your studio time.</p>
			</div>
		</section>

		<section class="form-panel" aria-live="polite">
			<div class="form-content" id="sign-in-view">
				<h2>Sign in</h2>
				<p class="intro">Enter your details to access your account.</p>
				<p class="connection-status" id="database-status" role="status">Connecting to Firebase Realtime Database…</p>
				<form id="sign-in-form">
					<div class="field">
						<label for="email">Email address</label>
						<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
					</div>
					<div class="field">
						<label for="password">Password</label>
						<div class="password-wrap">
							<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
							<button class="reveal" type="button" id="toggle-password" aria-pressed="false">Show</button>
						</div>
					</div>
					<button class="submit-button" type="submit">Sign in</button>
					<p class="form-message" id="sign-in-message" role="status"></p>
				</form>
			</div>
		</section>
	</main>

	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
		import { browserLocalPersistence, getAuth, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
		import { getDatabase, onValue, ref } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

		const firebaseConfig = {
			apiKey: "AIzaSyA2sDPaG8p8yXYXDDoF8U6cQDIZ5D5cfnk",
			authDomain: "studiobookingapp-114a7.firebaseapp.com",
			databaseURL: "https://studiobookingapp-114a7-default-rtdb.firebaseio.com",
			projectId: "studiobookingapp-114a7",
			storageBucket: "studiobookingapp-114a7.firebasestorage.app",
			messagingSenderId: "356544436239",
			appId: "1:356544436239:web:d4707344bacbb11afe6b7a",
			measurementId: "G-ESREKNYNLV"
		};

		const app = initializeApp(firebaseConfig);
		const auth = getAuth(app);
		const database = getDatabase(app);
		const rolesByEmail = new Map([
			["websankul@gmail.com", "Admin"],
			["ho.websankul@gmail.com", "General"]
		]);
		const signInForm = document.querySelector("#sign-in-form");
		const signInButton = signInForm.querySelector(".submit-button");
		const signInMessage = document.querySelector("#sign-in-message");
		const databaseStatus = document.querySelector("#database-status");
		const passwordInput = document.querySelector("#password");
		const passwordToggle = document.querySelector("#toggle-password");
		const persistenceReady = setPersistence(auth, browserLocalPersistence);

		passwordToggle.addEventListener("click", () => {
			const isVisible = passwordInput.type === "text";
			passwordInput.type = isVisible ? "password" : "text";
			passwordToggle.textContent = isVisible ? "Show" : "Hide";
			passwordToggle.setAttribute("aria-pressed", String(!isVisible));
		});

		signInForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			signInButton.disabled = true;
			signInMessage.textContent = "Signing in…";
			try {
				await persistenceReady;
				await signInWithEmailAndPassword(
					auth,
					document.querySelector("#email").value.trim(),
					passwordInput.value
				);
			} catch (error) {
				if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
					signInMessage.textContent = "Email or password is incorrect.";
				} else if (error.code === "auth/too-many-requests") {
					signInMessage.textContent = "Too many attempts. Please try again later.";
				} else if (error.code === "auth/invalid-email") {
					signInMessage.textContent = "Enter a valid email address.";
				} else {
					signInMessage.textContent = "Unable to sign in. Check your connection and Firebase Authentication settings.";
					console.error("Firebase sign-in failed:", error);
				}
			} finally {
				signInButton.disabled = false;
			}
		});

		persistenceReady.then(() => {
			onAuthStateChanged(auth, async (user) => {
				const role = user?.email ? rolesByEmail.get(user.email.toLowerCase()) : undefined;
				if (user && !role) {
					signInMessage.textContent = "This account is not authorized to use this app.";
					try {
						await signOut(auth);
					} catch (error) {
						console.error("Could not sign out an unauthorized account:", error);
					}
					return;
				}

				if (user) {
					window.location.replace("dashboard.html");
				}
			}, (error) => {
				signInMessage.textContent = "Unable to check your sign-in session.";
				console.error("Firebase authentication state failed:", error);
			});
		}).catch((error) => {
			signInMessage.textContent = "Unable to keep your sign-in session. Check your browser storage settings.";
			console.error("Firebase local session persistence failed:", error);
		});

		onValue(ref(database, ".info/connected"), (snapshot) => {
			databaseStatus.textContent = snapshot.val()
				? "Connected to Firebase Realtime Database."
				: "Connecting to Firebase Realtime Database…";
		}, (error) => {
			databaseStatus.textContent = "Could not connect to Firebase Realtime Database.";
			console.error("Firebase Realtime Database connection failed:", error);
		});
	</script>
</body>
</html>
